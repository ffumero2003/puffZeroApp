<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PuffZero</title>
    <meta
      name="description"
      content="PuffZero te acompaña en tu camino para dejar el vapeo, paso a paso."
    />
    <style>
      :root {
        --primary: #5974ff;
        --text: #1f2859;
        --muted: #828dbd;
        --bg: #f6f3ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 32px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      .links {
        margin-top: 32px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      a {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 600;
      }
      a.secondary {
        background: #fff;
        color: var(--primary);
        border: 2px solid var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/logo-puff-zero.png" alt="PuffZero" />
      <h1>PuffZero</h1>
      <p>
        Tu compañero para dejar el vapeo, paso a paso. Llevá registro de tus
        puffs, ahorrá dinero, y recuperá el control.
      </p>
      <div class="links">
        <a href="/privacy-policy">Política de Privacidad</a>
        <a class="secondary" href="/terms-of-use">Términos de Uso</a>
      </div>
    </div>
  </body>
</html>
